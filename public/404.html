<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Holidays by Design</title>
    <!--
      GitHub Pages has no server-side router, so it 404s any URL that isn't a real file
      (e.g. a direct link to /hbd-asia/journeys, or a refresh on that page). This is the
      well-known workaround (github.com/rafgraph/spa-github-pages): redirect to the real
      index.html, encoding the intended path in the query string; the matching script in
      index.html's <head> decodes it and restores the URL via history.replaceState before
      React Router reads it.

      pathSegmentsToKeep = 1 keeps the "/hbd-asia" segment — it must match vite.config.js's
      `base`. If the base path ever changes, update this number to match.
    -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
