<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- %BASE_URL% (not a literal "/...") so these resolve under the deployed subpath — see vite.config.js -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preload" as="image" href="%BASE_URL%images/hero-leopard.jpg" fetchpriority="high" />
    <title>Holidays by Design — Tailor-made journeys in Sri Lanka</title>
    <meta name="description" content="Adventure, relaxation and wellness journeys across Sri Lanka — from the hill country to the coast. Tailor-made by a Colombo-based team since 1995." />
    <meta property="og:title" content="Holidays by Design — Seek out Sri Lanka" />
    <meta property="og:description" content="Tailor-made adventure, relaxation and wellness journeys across Sri Lanka." />
    <meta property="og:type" content="website" />
    <!-- Other half of the public/404.html redirect trick — restores the real path GitHub Pages lost. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&') }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
